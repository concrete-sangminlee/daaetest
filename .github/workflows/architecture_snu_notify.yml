name: Notify new posts from architecture.snu.ac.kr

on:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다.
    # 최소 주기는 5분이며, 필요하면 */5로 조정하세요.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: "수동 실행 시 Slack으로 테스트 메시지(ping)를 보낼지 여부"
        required: false
        default: "true"
      test_post:
        description: "수동 실행 시 최신 글 1건을 [TEST]로 Slack에 전송(사이트 전체 posts 기준)"
        required: false
        default: "false"

concurrency:
  group: architecture-snu-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # state.json은 커밋하지 않고, Actions 캐시로만 "최신 커서"를 유지합니다.
      # 캐시는 best-effort라서(만료/삭제 가능) 드물게 state가 초기화될 수 있습니다.
      # 그 경우 첫 실행은 기준점 저장만 하고 종료(SEND_ON_FIRST_RUN=false)하도록 구성했습니다.
      - name: Restore state (cache)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Slack ping (manual run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ping == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"[daaetest] GitHub Actions 수동 실행 ping: Slack 전송 OK (site=architecture.snu.ac.kr)"}' \
            "$SLACK_WEBHOOK_URL" \
            | head -c 200

      - name: Send latest post (TEST, manual run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_post == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WP_BASE_URL: "https://architecture.snu.ac.kr"
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          
          wp_base = os.environ.get("WP_BASE_URL", "https://architecture.snu.ac.kr").rstrip("/")
          api = wp_base + "/wp-json/wp/v2/posts"
          
          params = {
              "per_page": 1,
              "page": 1,
              "orderby": "date",
              "order": "desc",
              "_fields": "id,date_gmt,link,title",
          }
          url = api + "?" + urllib.parse.urlencode(params, doseq=True)
          
          req = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=20) as resp:
              posts = json.load(resp)
          
          if not posts:
              text = "[TEST] architecture.snu.ac.kr 최신 글 조회 결과: 게시물이 없습니다."
          else:
              p = posts[0]
              title = p.get("title", {}).get("rendered", "") or ""
              title = html.unescape(title)
              title = re.sub(r"<[^>]+>", "", title)
              title = re.sub(r"\s+", " ", title).strip()
              link = (p.get("link") or "").strip()
              date_gmt = (p.get("date_gmt") or "").strip()
              pid = p.get("id")
              text = (
                  "[TEST] architecture.snu.ac.kr 최신 글 1건(사이트 전체 posts)\n"
                  f"ID: {pid}\n"
                  f"제목: {title}\n"
                  f"URL: {link}\n"
                  f"게시일(GMT): {date_gmt}"
              )
          
          webhook = os.environ["SLACK_WEBHOOK_URL"]
          payload = {"text": text, "unfurl_links": False, "unfurl_media": False}
          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req2 = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(req2, timeout=20) as resp2:
              out = resp2.read(200)
          print(out.decode("utf-8", errors="replace"))
          PY

      - name: Run notifier
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WP_BASE_URL: "https://architecture.snu.ac.kr"
          WP_WATCH_ALL: "true"
          STATE_PATH: "./state.json"
          WP_PER_PAGE: "50"
          MAX_NOTIFY_PER_RUN: "20"
          SEND_ON_FIRST_RUN: "false"
        run: |
          python bot.py

      - name: Save state (cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}


