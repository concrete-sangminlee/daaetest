name: Notify new posts from architecture.snu.ac.kr

on:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다.
    # 최소 주기는 5분이며, 필요하면 */5로 조정하세요.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: architecture-snu-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # state.json은 커밋하지 않고, Actions 캐시로만 "최신 커서"를 유지합니다.
      # 캐시는 best-effort라서(만료/삭제 가능) 드물게 state가 초기화될 수 있습니다.
      # 그 경우 첫 실행은 기준점 저장만 하고 종료(SEND_ON_FIRST_RUN=false)하도록 구성했습니다.
      - name: Restore state (cache)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Run notifier
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WP_BASE_URL: "https://architecture.snu.ac.kr"
          WP_WATCH_ALL: "true"
          STATE_PATH: "./state.json"
          WP_PER_PAGE: "50"
          MAX_NOTIFY_PER_RUN: "20"
          SEND_ON_FIRST_RUN: "false"
        run: |
          python bot.py

      - name: Save state (cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}


