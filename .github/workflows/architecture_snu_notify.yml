name: Notify new posts from architecture.snu.ac.kr

on:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다.
    # 최소 주기는 5분이며, 필요하면 */5로 조정하세요.
    - cron: "*/10 * * * *"
    # 매일 00:00 UTC(=09:00 KST)에 실행되는 heartbeat용 스케줄.
    # 이 시각에도 위 10분 주기 알림은 그대로 동작하고, 추가로 heartbeat 1건을 보냅니다.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: "수동 실행 시 Slack으로 테스트 메시지(ping)를 보낼지 여부"
        required: false
        default: "true"
      test_post:
        description: "수동 실행 시 최신 글 1건 전송(사이트 전체 posts 기준)"
        required: false
        default: "false"

concurrency:
  group: architecture-snu-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # state.json을 레포에 커밋해서 상태를 영구 보존하므로 쓰기 권한이 필요합니다.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 상태(state.json)는 이제 Actions 캐시가 아니라 레포에 커밋되어 유지됩니다.
      # actions/checkout이 이미 최신 state.json을 워킹트리에 가져오므로 별도 복원 단계가 필요 없습니다.

      - name: Slack ping (manual run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ping == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BASE_URL: "https://architecture.snu.ac.kr"
          ALERT_FEED_NAME: "건축학과"
          ALERT_EMOJI: "📢"
        run: |
          set -euo pipefail
          python bot.py --ping

      - name: Send latest post (TEST, manual run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_post == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          BASE_URL: "https://architecture.snu.ac.kr"
          ALERT_EMOJI: "📰"
          ALERT_FEED_NAME: "건축학과"
        run: |
          set -euo pipefail
          python bot.py --test-latest

      - name: Run notifier
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          BASE_URL: "https://architecture.snu.ac.kr"
          ALERT_EMOJI: "📰"
          ALERT_FEED_NAME: "건축학과"
          STATE_PATH: "./state.json"
          MAX_NOTIFY_PER_RUN: "20"
          SEND_ON_FIRST_RUN: "false"
        run: |
          python bot.py

      # 갱신된 state.json을 레포에 커밋해 상태를 영구 보존합니다.
      # - 실제 알림 실행 경로(schedule / workflow_dispatch)에서만 커밋합니다.
      # - state.json이 실제로 바뀐 경우에만 커밋/푸시합니다.
      # - keepalive 워크플로우 등과의 충돌 대비: push 전에 rebase, 거절 시 1회 재시도.
      # - 커밋 메시지에 [skip ci]를 넣어 재실행을 방지합니다.
      - name: Commit updated state
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --quiet --cached; then
            echo "state.json 변경 없음 — 커밋 건너뜀"
            exit 0
          fi
          git commit -m "chore: update notifier state [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          if ! git push origin "HEAD:${{ github.ref_name }}"; then
            echo "push 거절 — rebase 후 1회 재시도"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # 정기 생존 신호(heartbeat): 매일 00:00 UTC 스케줄에서만 전송합니다.
      # continue-on-error로 heartbeat 실패가 워크플로우(본 알림)를 실패시키지 않도록 합니다.
      - name: Heartbeat (daily)
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 0 * * *' }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BASE_URL: "https://architecture.snu.ac.kr"
          ALERT_FEED_NAME: "건축학과"
          ALERT_EMOJI: "💚"
        run: |
          python bot.py --heartbeat
