name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 서드파티 의존성은 설치하지 않습니다. 테스트는 tests/_stubs.py로
      # requests/urllib3/dotenv를 오프라인 스텁으로 대체해 네트워크 없이 실행됩니다.
      - name: Compile bot.py
        run: python -m py_compile bot.py

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
